# from story-indexer
[project]
name = "vitals-api"
version = "2.1.1"
description='Media Cloud Vitals API Server'
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Phil Budne", email = "phil@regressive.org"},
]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiohttp ~= 3.14.0",
    "fastapi ~= 0.150.0",
    "fastapi-cache2 ~= 0.2.0",
    "jinja2 ~= 3.1.0",		# needed for fastapi-cache2 w/ starlette 1.0
    "uvicorn ~= 0.54.0"
# MAYBE:
#   "sentry-sdk[fastapi] ~= 1.10.0",
]

[project.optional-dependencies]
deploy = [
   # .pre-commit-config.yaml runs "uv lock --upgrade-package mc-deploy"
   # to force symbolic .latest tag to be re-resolved to a git hash
   # on each commit.
   "mc-deploy @ git+https://github.com/mediacloud/system-dev-ops@mc-deploy-0.19.latest#subdirectory=deploy/mc-deploy",
]

# for pre-commit hook (and "make lint")
# additional packages for mypy belong in pre-commit section below
dev = [
    "pre-commit ~= 4.7.0"
]

# dependencies for mypy
# my runs in dev .venv with uv
mypy = [
    "mypy"
]

[tool.isort]
profile = "black"

[tool.mypy]
# from rss-fetcher via story-indexer!
# originally from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# from https://quantlane.com/blog/type-checking-large-codebase/
# in the order they appear:
disallow_untyped_calls = true
disallow_untyped_decorators = true
#disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_configs = true

# look for local stubs to PyPI packages in top level stubs directory
#mypy_path = "stubs"

[project.urls]
"Homepage" = "https://mediacloud.org"
"Bug Tracker" = "https://github.com/mediacloud/dashboard-api/issues"
"Source Code" = "https://github.com/mediacloud/dashboard-api"
